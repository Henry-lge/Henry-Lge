# ─────────────────────────────────────────────
#  Projekte – jeder [[projects]]-Block ist eine Karte.
#  Neues Projekt: Block kopieren und Werte ändern.
# ─────────────────────────────────────────────

[[projects]]
emoji       = "🛡️"
name        = "MoonProtect"
url         = "https://moonprotect.com"
description = "Sicherheits-Plugins für Minecraft-Server – Schutz, der einfach funktioniert."

  # Unterprojekte (optional, beliebig viele)
  [[projects.items]]
  name        = "MoonCheat"
